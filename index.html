<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechLearn — الرئيسية</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="home-page">

  <!-- Animated background blobs -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="home-wrapper">

    <div class="home-card fade-in">

      <div class="home-logo">
        <span class="logo-icon">⚡</span>
        <span class="logo-text">TechLearn</span>
      </div>

      <h1 class="home-title">أهلاً بيك! 👋</h1>
      <p class="home-sub">منصتك لتعلم التقنية بأسلوبك — ابدأ رحلتك دلوقتي</p>

      <div class="home-stats">
        <div class="hstat">
          <span class="hstat-num">+5000</span>
          <span class="hstat-label">طالب</span>
        </div>
        <div class="hstat-div"></div>
        <div class="hstat">
          <span class="hstat-num">+200</span>
          <span class="hstat-label">درس</span>
        </div>
        <div class="hstat-div"></div>
        <div class="hstat">
          <span class="hstat-num">98%</span>
          <span class="hstat-label">رضا</span>
        </div>
      </div>

      <div class="home-actions">
        <a href="signup.html" class="btn-signup">إنشاء حساب جديد ✨</a>
        <a href="login.html"  class="btn-login">عندي حساب — سجّل دخول</a>
      </div>

      <p class="home-note">🔒 بياناتك آمنة تماماً معانا</p>

    </div>

  </div>

</body>
</html>
